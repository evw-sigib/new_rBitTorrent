name: CI / Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  APP_DIR: rbittorrent
  CRATE_DIR: rbittorrent/supervisor
  CARGO_TERM_COLOR: always
  # Supervisor revision whose schemas config.yaml is validated against.
  HA_SUPERVISOR_REF: e610ca810eab5f7444dfb7f74a3b7c869685c797

jobs:
  supervisor:
    name: Supervisor crate (fmt, clippy, tests, cross-builds)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.CRATE_DIR }}
      - name: cargo fmt --check
        working-directory: ${{ env.CRATE_DIR }}
        run: cargo fmt --all -- --check
      - name: cargo clippy -D warnings
        working-directory: ${{ env.CRATE_DIR }}
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo test
        working-directory: ${{ env.CRATE_DIR }}
        run: cargo test --locked
      - name: nftables ruleset in the real kernel (private netns)
        working-directory: ${{ env.CRATE_DIR }}
        run: |
          # Ubuntu's mirrors answer 503 now and then: retry before failing.
          for i in 1 2 3 4; do
            sudo apt-get -o Acquire::Retries=5 update -qq \
              && sudo apt-get -o Acquire::Retries=5 install -y -qq nftables && break
            [ "$i" = 4 ] && exit 1
            sleep $((i * 15))
          done
          # The library's unit-test binary (the only one with nft_live).
          BIN=$(cargo test --locked --lib --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .executable != null and .target.kind == ["lib"]) | .executable')
          test "$(wc -l <<<"$BIN")" -eq 1
          out=$(sudo NFT_LIVE_TEST=1 unshare -n "$BIN" nft_live --nocapture 2>&1)
          echo "$out"
          # A filter that matches nothing also "passes": require the test ran.
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' <<<"$out"
          if grep -q 'skipped (set NFT_LIVE_TEST' <<<"$out"; then exit 1; fi
      # mimalloc is C, so the musl targets need a cross C compiler: zig.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install cargo-zigbuild
        run: pip install -q cargo-zigbuild==0.24.1 ziglang==0.17.1
      - name: Static musl cross-builds (zig cc)
        working-directory: ${{ env.CRATE_DIR }}
        run: |
          # Sizes go to the job log as well as the step summary.
          echo "| target | rbittorrent-supervisor |" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" | tee -a "$GITHUB_STEP_SUMMARY"
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            cargo zigbuild --locked --release --target "$t"
            f="target/$t/release/rbittorrent-supervisor"
            file "$f"
            file "$f" | grep -Eq 'statically linked|static-pie linked'
            echo "| \`$t\` | $(stat -c %s "$f") bytes |" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          target/x86_64-unknown-linux-musl/release/rbittorrent-supervisor --version

  app-config:
    name: App config vs. Supervisor schema
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: home-assistant/supervisor
          ref: ${{ env.HA_SUPERVISOR_REF }}
          path: .ha-supervisor
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Supervisor requirements
        run: pip install -q -r .ha-supervisor/requirements.txt
      - name: Validate config.yaml, translations and security policy
        run: PYTHONPATH=.ha-supervisor python .github/scripts/validate_app.py "$APP_DIR"
      - name: Lint the test and CI Python scripts (pyflakes)
        run: |
          pip install -q pyflakes
          python -m pyflakes .github/scripts "$APP_DIR/tests"

  e2e:
    name: Kernel end-to-end (WireGuard + kill-switch + NAT-PMP)
    runs-on: ubuntu-24.04
    needs: supervisor
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.CRATE_DIR }}
      - name: Build supervisor
        working-directory: ${{ env.CRATE_DIR }}
        run: cargo build --locked --release
      - name: Install kernel tooling
        run: |
          # Ubuntu's mirrors answer 503 now and then: retry before failing.
          for i in 1 2 3 4; do
            sudo apt-get -o Acquire::Retries=5 update -qq \
              && sudo apt-get -o Acquire::Retries=5 install -y -qq \
                wireguard-tools nftables iproute2 && break
            [ "$i" = 4 ] && exit 1
            sleep $((i * 15))
          done
          sudo modprobe wireguard
      - name: Run end-to-end test in network namespaces
        run: sudo python3 "$APP_DIR/tests/e2e_netns.py" --supervisor "$CRATE_DIR/target/release/rbittorrent-supervisor"

  image:
    name: Image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [supervisor, app-config, e2e]
    # Both binaries (rtbit is compiled from source with mimalloc) build
    # natively on each architecture's own runner: no QEMU emulation.
    timeout-minutes: 120
    # Builds and tests only; publishing (with write access) is its own job.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Read image name and version from config.yaml
        id: meta
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import yaml
          c = yaml.safe_load(open("rbittorrent/config.yaml"))
          print("version=" + str(c["version"]))
          print("image=" + c["image"].replace("{arch}", "${{ matrix.arch }}"))
          EOF
      - uses: docker/setup-buildx-action@v3
      - name: Build (load locally for tests)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.meta.outputs.version }}
            BUILD_REPOSITORY=${{ github.repository }}
          tags: local/rbittorrent:test
          load: true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
      - name: Smoke tests
        env:
          IMG: local/rbittorrent:test
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          run() { docker run --rm --platform "$PLATFORM" "$@"; }
          echo "::group::binaries"
          run --entrypoint /usr/local/bin/rbittorrent-supervisor "$IMG" --version
          run --entrypoint /usr/local/bin/rbittorrent-supervisor "$IMG" --help
          # Started only by the supervisor, with a pipe on stdin: by hand it refuses.
          set +e; run --entrypoint /usr/local/bin/rbittorrent-supervisor "$IMG" ingress-proxy; code=$?; set -e
          test "$code" -eq 2
          # Docker HEALTHCHECK: fails (non-zero) when nothing serves /__health.
          if run --entrypoint /usr/local/bin/rbittorrent-supervisor "$IMG" healthcheck; then exit 1; fi
          run --entrypoint /usr/local/bin/rtbit "$IMG" --version
          run --entrypoint /usr/local/bin/rtbit "$IMG" --help | sed -n 1,20p
          # The flags the supervisor relies on are rtbit's global options.
          help=$(run --entrypoint /usr/local/bin/rtbit "$IMG" --help)
          for flag in disable-upnp-port-forward disable-lsd bind-device ipv4-only listen-port; do
            grep -q -- "--$flag" <<<"$help" || { echo "rtbit --help lacks --$flag"; exit 1; }
          done
          # rtbit is our own build: mimalloc is linked in as the allocator.
          # (No `producer | grep -q` anywhere: with pipefail, grep -q exiting
          # early kills the producer with SIGPIPE and fails the step.)
          count=$(run --entrypoint /bin/sh "$IMG" -c 'grep -c mimalloc /usr/local/bin/rtbit || true')
          test "$count" -gt 0
          echo "::endgroup::"
          echo "::group::tools"
          run --entrypoint ip "$IMG" -V | grep iproute2
          run --entrypoint wg "$IMG" --version
          run --entrypoint nft "$IMG" --version
          echo "::endgroup::"
          echo "::group::forbidden components absent"
          run --entrypoint /bin/sh "$IMG" -c '
            set -e
            for f in /usr/bin/wg-quick /bin/bash /usr/bin/bash /init /etc/s6-overlay /usr/sbin/openvpn; do
              if [ -e "$f" ]; then echo "found forbidden $f"; exit 1; fi
            done
            echo "no wg-quick, bash, s6-overlay or openvpn"'
          echo "::endgroup::"
          echo "::group::static linking (ldd)"
          run --entrypoint /usr/bin/ldd "$IMG" /usr/local/bin/rbittorrent-supervisor 2>&1 || true
          run --entrypoint /usr/bin/ldd "$IMG" /usr/local/bin/rtbit 2>&1 || true
          cid=$(docker create --platform "$PLATFORM" "$IMG")
          docker cp "$cid:/usr/local/bin/rbittorrent-supervisor" ./rbittorrent-supervisor
          docker cp "$cid:/usr/local/bin/rtbit" ./rtbit
          docker rm "$cid" >/dev/null
          for f in rbittorrent-supervisor rtbit; do
            file "$f"
            file "$f" | grep -Eq 'statically linked|static-pie linked'
          done
          echo "::endgroup::"
          echo "::group::fail-closed: VPN on without a WireGuard setup stops the app"
          echo '{"vpn_enabled": true}' > options.json
          set +e
          out=$(run -v "$PWD/options.json:/data/options.json:ro" "$IMG" 2>&1); code=$?
          set -e
          echo "$out"
          test "$code" -eq 1
          grep -q 'VPN mode is on' <<<"$out"
          grep -qi 'wg0.conf' <<<"$out"
          if grep -qi 'panicked' <<<"$out"; then exit 1; fi
          echo "::endgroup::"
          echo "::group::direct mode: fresh install without a VPN"
          echo '{}' > direct.json
          # Without NET_ADMIN the Web UI port rules cannot be loaded, so the
          # app must stop instead of exposing 8080 to everyone.
          set +e
          out=$(run -v "$PWD/direct.json:/data/options.json:ro" "$IMG" 2>&1); code=$?
          set -e
          echo "$out" | tail -n 20
          test "$code" -eq 1
          grep -q 'direct-mode port rules' <<<"$out"
          docker run -d --name direct --platform "$PLATFORM" --cap-add NET_ADMIN \
            -v "$PWD/direct.json:/data/options.json:ro" "$IMG"
          ok=0
          for i in $(seq 1 90); do
            if docker exec direct /usr/local/bin/rbittorrent-supervisor healthcheck; then ok=1; break; fi
            sleep 1
          done
          logs=$(docker logs direct 2>&1)
          tail -n 60 <<<"$logs"
          test "$ok" -eq 1
          grep -q 'VPN OFF' <<<"$logs"
          grep -q 'direct connection: LAN \[' <<<"$logs"
          # The runners' kernels have Landlock: both children must be confined.
          grep -q 'rtbit filesystem sandbox active' <<<"$logs"
          grep -q 'Ingress proxy filesystem sandbox active' <<<"$logs"
          docker exec direct nft list table inet direct
          # The supervisor stores the Web UI account before rtbit's first
          # start: the API on 8080 is never open, even on a fresh install.
          grep -q 'auth: enabled (user "admin")' <<<"$logs"
          if docker exec direct wget -qO /dev/null http://127.0.0.1:8080/api/v2/torrents/info; then
            echo "rtbit's API answered without a login"; exit 1
          fi
          # The status bar data: vpn=false, the listen port, no tunnel.
          docker exec direct /bin/sh -c 'wget -qO- http://127.0.0.1:8099/__health' | tee health.json
          grep -q '"vpn":false' health.json
          grep -q '"port":4240' health.json
          grep -q '"fs_sandbox":true' health.json
          # PID 1 is not dumpable: root without CAP_SYS_PTRACE (docker exec,
          # like rtbit) cannot read its environment.
          if docker exec direct cat /proc/1/environ >/dev/null 2>&1; then
            echo "PID 1's environment is readable"; exit 1
          fi
          # Memory of the three processes (KiB), idle and with 30 paused
          # torrents; the runner is a LAN client of the Web UI on 8080.
          ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' direct)
          pw=$(docker exec direct cat /config/.webui-password)
          rss() {
            docker exec direct /bin/sh -c 'for p in $(pidof rbittorrent-supervisor rtbit); do
              echo "$(cat /proc/$p/comm) $p $(grep VmRSS /proc/$p/status | tr -s " " | cut -d" " -f2)"; done'
          }
          sleep 10
          idle=$(rss)
          # The qBittorrent API calls Sonarr, Radarr and the HA integration
          # make, against the real rtbit inside the Landlock sandbox.
          echo "::group::qBittorrent API against the real rtbit (Landlock)"
          python3 -I "$APP_DIR/tests/qbit_api_smoke.py" "http://$ip:8080" admin "$pw" /media/rbittorrent/downloads
          python3 -I "$APP_DIR/tests/qbit_api_smoke.py" --load 30 "http://$ip:8080" admin "$pw"
          echo "::endgroup::"
          sleep 10
          loaded=$(rss)
          mem() { awk -v n="$1" -v want="$2" '$1 ~ n && (want == "" || (want == "1") == ($2 == 1)) {print $3; exit}'; }
          {
            echo "| memory (VmRSS) | idle | 30 paused torrents |"
            echo "|---|---|---|"
            echo "| supervisor (PID 1) | $(mem rbittorrent 1 <<<"$idle") KiB | $(mem rbittorrent 1 <<<"$loaded") KiB |"
            echo "| Ingress proxy | $(mem rbittorrent 0 <<<"$idle") KiB | $(mem rbittorrent 0 <<<"$loaded") KiB |"
            echo "| rtbit | $(mem rtbit "" <<<"$idle") KiB | $(mem rtbit "" <<<"$loaded") KiB |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          docker stop -t 30 direct
          test "$(docker inspect -f '{{.State.ExitCode}}' direct)" -eq 0
          logs=$(docker logs direct 2>&1)
          grep -q 'shutdown complete' <<<"$logs"
          docker rm direct >/dev/null
          echo "::endgroup::"
          echo "::group::fail-closed: no sandbox at all (Docker's profile, Landlock blocked)"
          # Everything allowed except Landlock, which answers EPERM. Docker's
          # own AppArmor profile is not the app's, so nothing confines rtbit.
          printf '%s' '{"defaultAction":"SCMP_ACT_ALLOW","syscalls":[{"names":["landlock_create_ruleset","landlock_add_rule","landlock_restrict_self"],"action":"SCMP_ACT_ERRNO","errnoRet":1}]}' > no-landlock.json
          nolandlock=(--security-opt "seccomp=$PWD/no-landlock.json")
          wg='"wg_private_key": "aGVsbG8taGVsbG8taGVsbG8taGVsbG8taGVsbG8tISE=", "wg_public_key": "d29ybGQtd29ybGQtd29ybGQtd29ybGQtd29ybGQtISE=", "wg_endpoint": "203.0.113.1:51820", "wg_address": "10.2.0.2/32", "wg_dns": "10.2.0.1"'
          echo "{$wg}" > vpn.json
          # VPN on or off: refuses before rtbit (or its auth helper) ever runs.
          for opts in vpn.json direct.json; do
            set +e
            out=$(run --cap-add NET_ADMIN "${nolandlock[@]}" -v "$PWD/$opts:/data/options.json:ro" "$IMG" 2>&1); code=$?
            set -e
            echo "$out" | tail -n 20
            test "$code" -eq 1
            grep -q 'the filesystem sandbox is not available' <<<"$out"
            grep -q 'Landlock is blocked' <<<"$out"
            grep -q 'allow_unsandboxed' <<<"$out"
            if grep -q 'reset-password\|auth: enabled' <<<"$out"; then echo "rtbit ran without a sandbox"; exit 1; fi
          done
          # The explicit opt-out gets past the check (and then stops at the
          # firewall here: no NET_ADMIN).
          echo "{$wg, \"allow_unsandboxed\": true}" > vpn-unsandboxed.json
          set +e
          out=$(run "${nolandlock[@]}" -v "$PWD/vpn-unsandboxed.json:/data/options.json:ro" "$IMG" 2>&1)
          set -e
          echo "$out" | tail -n 20
          grep -q 'running without it because `allow_unsandboxed` is on' <<<"$out"
          # Direct connection with the opt-out: starts, warns, and the status
          # bar data says so.
          echo '{"allow_unsandboxed": true}' > direct-unsandboxed.json
          docker run -d --name nosb --platform "$PLATFORM" --cap-add NET_ADMIN "${nolandlock[@]}" \
            -v "$PWD/direct-unsandboxed.json:/data/options.json:ro" "$IMG"
          ok=0
          for i in $(seq 1 90); do
            if docker exec nosb /usr/local/bin/rbittorrent-supervisor healthcheck; then ok=1; break; fi
            sleep 1
          done
          logs=$(docker logs nosb 2>&1)
          tail -n 30 <<<"$logs"
          test "$ok" -eq 1
          grep -q 'running without it because `allow_unsandboxed` is on' <<<"$logs"
          docker exec nosb /bin/sh -c 'wget -qO- http://127.0.0.1:8099/__health' | tee health.json
          grep -q '"fs_sandbox":false' health.json
          docker rm -f nosb >/dev/null
          echo "::endgroup::"
          echo "::group::AppArmor: the app's own profile, as Home Assistant OS loads it"
          # Home Assistant OS kernels have AppArmor and no Landlock. The
          # Supervisor renames the profile to the app's slug and runs the
          # container with it; the same here, with Landlock blocked.
          if ! command -v aa-exec >/dev/null || ! file -L /bin/busybox 2>/dev/null | grep -q 'statically linked\|static-pie'; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq apparmor-utils busybox-static >/dev/null
          fi
          sed 's/^profile rbittorrent /profile local_rbittorrent /' "$APP_DIR/apparmor.txt" > aa-local.txt
          sudo apparmor_parser -r -W aa-local.txt
          loaded=$(sudo grep -cE '^local_rbittorrent(//(rtbit|ingress))? \(enforce\)$' /sys/kernel/security/apparmor/profiles)
          test "$loaded" -eq 3
          # The child profiles themselves, on the host, with a static busybox
          # standing in for the confined binary (root, all capabilities).
          sudo mkdir -p /config/db /config/wireguard /data /app_configs/other /media/rbt-aa
          for f in /config/wg0.conf /config/.webui-password /config/wireguard/x.conf /data/options.json /app_configs/other/options.json; do
            echo secret | sudo tee "$f" >/dev/null
          done
          echo db | sudo tee /config/db/session.json >/dev/null
          confined() { sudo aa-exec -p "local_rbittorrent//$1" -- /bin/busybox "${@:2}"; }
          confined rtbit cat /config/db/session.json
          confined rtbit sh -c 'echo ok > /media/rbt-aa/written'
          test "$(cat /media/rbt-aa/written)" = ok
          for f in /config/wg0.conf /config/.webui-password /config/wireguard/x.conf /data/options.json /app_configs/other/options.json /proc/1/environ; do
            if confined rtbit cat "$f" >/dev/null 2>&1; then echo "rtbit's profile lets it read $f"; exit 1; fi
          done
          for f in /config/wg0.conf /config/.webui-password /config/.migrated; do
            if confined rtbit sh -c "echo x > $f" 2>/dev/null; then echo "rtbit's profile lets it write $f"; exit 1; fi
          done
          if confined rtbit ls /app_configs/other >/dev/null 2>&1; then echo "rtbit's profile lists /app_configs"; exit 1; fi
          confined ingress cat /etc/hostname
          if confined ingress sh -c 'echo x > /media/rbt-aa/ingress' 2>/dev/null; then echo "the Ingress profile can write"; exit 1; fi
          if confined ingress cat /config/db/session.json >/dev/null 2>&1; then echo "the Ingress profile reads /config"; exit 1; fi
          # The app under it: AppArmor alone confines both children.
          docker run -d --name aa --platform "$PLATFORM" --cap-add NET_ADMIN \
            --security-opt apparmor=local_rbittorrent "${nolandlock[@]}" \
            -v "$PWD/direct.json:/data/options.json:ro" "$IMG"
          ok=0
          for i in $(seq 1 90); do
            if docker exec aa /usr/local/bin/rbittorrent-supervisor healthcheck; then ok=1; break; fi
            sleep 1
          done
          logs=$(docker logs aa 2>&1)
          tail -n 40 <<<"$logs"
          sudo dmesg | grep 'apparmor="DENIED"' | tail -n 40 || true
          test "$ok" -eq 1
          grep -q 'AppArmor profile `local_rbittorrent` confines the app' <<<"$logs"
          grep -q 'rtbit filesystem sandbox active (AppArmor `local_rbittorrent//rtbit`)' <<<"$logs"
          grep -q 'Ingress proxy filesystem sandbox active (AppArmor `local_rbittorrent//ingress`)' <<<"$logs"
          grep -q 'AppArmor `local_rbittorrent//rtbit (enforce)`' <<<"$logs"
          grep -q 'AppArmor `local_rbittorrent//ingress (enforce)`' <<<"$logs"
          grep -q 'auth: enabled (user "admin")' <<<"$logs"
          label=$(docker exec aa /bin/sh -c 'cat /proc/$(pidof rtbit)/attr/current')
          test "$label" = "local_rbittorrent//rtbit (enforce)"
          docker exec aa /bin/sh -c 'wget -qO- http://127.0.0.1:8099/__health' | tee health.json
          grep -q '"fs_sandbox":true' health.json
          if docker exec aa cat /proc/1/environ >/dev/null 2>&1; then
            echo "PID 1's environment is readable"; exit 1
          fi
          # The same API calls with rtbit confined by AppArmor alone.
          ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' aa)
          pw=$(docker exec aa cat /config/.webui-password)
          python3 -I "$APP_DIR/tests/qbit_api_smoke.py" "http://$ip:8080" admin "$pw" /media/rbittorrent/downloads
          sudo dmesg | grep 'apparmor="DENIED"' | tail -n 20 || true
          docker stop -t 30 aa
          test "$(docker inspect -f '{{.State.ExitCode}}' aa)" -eq 0
          docker rm aa >/dev/null
          echo "::endgroup::"
          size=$(docker image inspect -f '{{.Size}}' "$IMG")
          {
            echo "### ${{ matrix.arch }}"
            echo "| item | size |"
            echo "|---|---|"
            echo "| image (uncompressed) | $((size / 1024 / 1024)) MiB |"
            echo "| rbittorrent-supervisor | $(stat -c %s rbittorrent-supervisor) bytes |"
            echo "| rtbit | $(stat -c %s rtbit) bytes |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: rtbit memory benchmark (rtbit alone)
        env:
          IMG: local/rbittorrent:test
        run: |
          set -euo pipefail
          docker run -d --name bench --entrypoint /usr/local/bin/rtbit \
            -e XDG_DATA_HOME=/config/db -e XDG_CACHE_HOME=/config/cache -e XDG_CONFIG_HOME=/config/db \
            -e RTBIT_HTTP_API_LISTEN_ADDR=0.0.0.0:8080 -e RTBIT_UPNP_PORT_FORWARD_DISABLE=true \
            -e RTBIT_LSD_DISABLE=true -e RTBIT_IPV4_ONLY=true -e RTBIT_FASTRESUME=true \
            -e RTBIT_DOWNLOAD_FOLDER=/tmp -p 127.0.0.1:8080:8080 \
            "$IMG" server start /tmp
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 && break; sleep 1; done
          sleep 20
          rss() { docker exec bench grep -E 'VmRSS' /proc/1/status | awk '{print $2}'; }
          idle=$(rss)
          tok=$(docker exec bench sh -c 'cat /config/db/*/setup-token')
          curl -fsS -o /dev/null -X POST -H 'Content-Type: application/json' \
            -d "{\"setup_token\":\"$tok\",\"username\":\"bench\",\"password\":\"bench-password-123\"}" \
            http://127.0.0.1:8080/auth/setup
          for i in 1 2 3; do
            curl -fsS -o /dev/null -d 'username=bench&password=bench-password-123' http://127.0.0.1:8080/api/v2/auth/login
          done
          sleep 5
          after=$(rss)
          docker exec bench cat /proc/1/status | grep -E 'VmRSS|VmHWM|RssAnon|RssFile|Threads'
          docker rm -f bench >/dev/null
          {
            echo "| rtbit alone, idle RSS (${{ matrix.arch }}) | ${idle} KiB |"
            echo "| rtbit RSS after setup + 3 logins | ${after} KiB |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the tested image for publishing
        if: github.event_name == 'push'
        run: docker save local/rbittorrent:test | gzip -1 > image-${{ matrix.arch }}.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: image-${{ matrix.arch }}
          path: image-${{ matrix.arch }}.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Publish (GHCR)
    runs-on: ubuntu-24.04
    needs: image
    if: github.event_name == 'push'
    # One publish at a time: a commit and its tag pushed together queue up.
    concurrency:
      group: publish-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the smoke-tested images and the multi-arch manifest
        run: |
          set -euo pipefail
          read -r version template < <(python3 -c '
          import yaml
          c = yaml.safe_load(open("rbittorrent/config.yaml"))
          print(c["version"], c["image"])')
          multi="${template/\{arch\}-/}"
          exists() { docker buildx imagetools inspect "$1" >/dev/null 2>&1; }
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # A release: the tag must match config.yaml, and a published
            # version is never overwritten.
            if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
              echo "tag $GITHUB_REF_NAME does not match config.yaml version $version"; exit 1
            fi
            for ref in "$multi:$version" "${template/\{arch\}/amd64}:$version" "${template/\{arch\}/aarch64}:$version"; do
              if exists "$ref"; then echo "$ref is already published; bump the version"; exit 1; fi
            done
            tags="$version latest"
          else
            # main: a rolling `edge` tag only; versions come from release tags.
            tags="edge"
          fi
          for arch in amd64 aarch64; do
            img="${template/\{arch\}/$arch}"
            gunzip -c "image-$arch.tar.gz" | docker load
            for t in $tags; do
              docker tag local/rbittorrent:test "$img:$t"
              docker push "$img:$t"
            done
          done
          for t in $tags; do
            docker buildx imagetools create -t "$multi:$t" \
              "${template/\{arch\}/amd64}:$t" \
              "${template/\{arch\}/aarch64}:$t"
          done
          docker buildx imagetools inspect "$multi:${tags%% *}"
